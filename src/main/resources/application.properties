spring.application.name=ai-doc
spring.datasource.url=jdbc:mysql://localhost:3306/aidoc
spring.datasource.username=root
spring.datasource.password=xcx1s6esuv

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

app.excel.header-row-index=0

nvidia.api.key=${NVIDIA_API_KEY}
nvidia.api.base-url=https://integrate.api.nvidia.com/v1
nvidia.api.connect-timeout=10s
nvidia.api.read-timeout=60s
nvidia.parse.model=nvidia/nemotron-parse
nvidia.mapping.model=nvidia/nemotron-3-super-120b-a12b

app.mapping.llm.confidence-threshold=0.80

# Page rendering resolution. Handwriting and faint scans lose strokes below ~200 DPI,
# and the parse model cannot report a box for a word it could not read.
app.render.dpi=200

# Output budget per parsed page. A dense page returned as LaTeX overruns a small budget
# and comes back truncated, which reads downstream as a page that simply had less on it.
nvidia.parse.max-tokens=4096

# Column-name inference, used only when a document arrives without an Excel template.
nvidia.headers.max-tokens=1024
nvidia.headers.max-cells=400
