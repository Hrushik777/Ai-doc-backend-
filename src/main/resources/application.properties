spring.application.name=ai-doc

# The port the platform tells us to listen on. Render and most container hosts inject PORT and
# route traffic to it; without this the app stays on 8080 and never passes their health check.
server.port=${PORT:8080}

# Database disabled - see the exclude list on AiDocApplication for why, and for how to restore
# it. Nothing in the processing pipeline reads persisted state, so these stay commented until
# there is something worth storing.
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aidoc}
# spring.datasource.username=${DB_USERNAME:root}
# Supplied by the environment. The value that used to sit here is compromised - it was
# committed to the repository - and must be rotated.
# spring.datasource.password=${DB_PASSWORD:}

# spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
# spring.jpa.show-sql=${DB_SHOW_SQL:false}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ----------------------------------------------------------------- authentication
# Only the three processing endpoints require a signed-in user. The landing page, and choosing
# files and a template, stay open: the gate exists to ask for an account when work is about to
# be spent, not before a stranger can see what this does.

# The Google OAuth client id, supplied by the environment and kept out of the repository. It
# must match the id the frontend was built with, and it is what the ID token's audience is
# pinned to: a token Google minted for some other application is a perfectly valid Google token,
# and this is what rejects it.
#
# Note it is not a secret in the way JWT_SECRET is - it is inlined into the frontend bundle and
# readable by anyone using the site. Knowing it is still not enough to mint tokens against it:
# Google only issues one to a page whose origin appears under Authorised JavaScript origins for
# this client. That list, in the Google Cloud console, is the other half of this check.
app.auth.google.client-id=${GOOGLE_CLIENT_ID}

# Signing key for our own session tokens. A real secret, with no default on purpose: a fallback
# key would make every authentication check decorative. At least 32 bytes.
#   openssl rand -base64 48
app.auth.jwt.secret=${JWT_SECRET}

# How long a session lasts before the browser signs in again. There is no database and therefore
# no revocation, so this is also the window a leaked token stays usable - shorten it if that
# matters more than not being asked to sign in again.
app.auth.jwt.ttl=${JWT_TTL:24h}

# Comma-separated addresses allowed to sign in. Blank means any Google account, which is the
# thing to change first if this is public: signing in proves someone has a Google account, not
# that they are welcome, and every document processed spends NVIDIA credit on the configured key.
app.auth.allowed-emails=${ALLOWED_EMAILS:}

app.excel.header-row-index=0

nvidia.api.key=${NVIDIA_API_KEY}
nvidia.api.base-url=https://integrate.api.nvidia.com/v1
nvidia.api.connect-timeout=10s
nvidia.api.read-timeout=60s
nvidia.parse.model=nvidia/nemotron-parse
nvidia.mapping.model=nvidia/nemotron-3-super-120b-a12b

app.mapping.llm.confidence-threshold=0.80

# Page rendering resolution. Handwriting and faint scans lose strokes below ~200 DPI,
# and the parse model cannot report a box for a word it could not read.
app.render.dpi=200

# Output budget per parsed page. A dense page returned as LaTeX overruns a small budget
# and comes back truncated, which reads downstream as a page that simply had less on it.
nvidia.parse.max-tokens=4096

# How many pages may be at Nemotron Parse at once. A page spends seconds in that call and
# microseconds in our own code, so parsing them one after another made a ten-page document
# ten round trips end to end.
#
# This also caps memory: each in-flight page holds its encoded PNG and the base64 copy in the
# request, so raising it multiplies that. Set to 1 to restore strictly sequential parsing.
# Raise it only alongside the upstream rate limit - every page in flight is a request.
nvidia.parse.concurrency=4

# Column-name inference, used only when a document arrives without an Excel template.
#
# The budget is deliberately generous: a reasoning model spends output tokens before it
# answers, and a header call that runs out mid-JSON returns nothing - which drops the whole
# document to the raw-field fallback. A second attempt doubles whatever is set here.
nvidia.headers.max-tokens=3072
nvidia.headers.max-cells=400

# Provider-level constraints for the header call, matching nvidia.mapping.*. Attempt 1 sends
# them; attempt 2 drops them, so an endpoint that rejects either still gets an answer through.
# Set to false if this model rejects them on every call and the retry is being wasted.
nvidia.headers.json-mode=true
nvidia.headers.disable-thinking=true

# Whether a document that states its own column names settles the matter without asking the
# model. True skips a call and keeps the headers the document actually wrote down; false asks
# the model even then, which suits documents whose header cells pack several values into one.
app.headers.prefer-document-headers=true

# Whether the raw-field fallback also writes the element type and its bounding box. That is
# debugging output - a caller who reaches this path wanted a spreadsheet of their document,
# not four columns of normalized coordinates - so it is off unless asked for.
app.raw-fields.include-geometry=false

# Where uploaded source documents are stored. Filenames are sanitized before use.
app.upload.directory=${UPLOAD_DIR:Uploads}

# Largest batch accepted by /process/batch.
app.batch.max-documents=20

# Browser origins allowed to call the API.
# The deployed frontend is included in the default so a fresh deploy works without setting
# CORS_ORIGINS. Matching is on the exact origin string, so the spelling here is deliberate -
# the Render service name is "ai-doc-forntend", not "frontend". CORS_ORIGINS still overrides
# the whole list when a different frontend needs to be allowed.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,https://ai-doc-forntend.onrender.com}

# Abbreviations that resolve to a canonical field name, as alias=canonical pairs separated
# by semicolons. Applied to document fields and template headers alike, so both spellings
# match. Blank keeps the built-in engineering defaults; "none" disables aliasing.
app.mapping.aliases=

# What to do when a document arrives with no Excel template.
#   INFERRED_HEADERS - name the columns from the document (its own header band or labels
#                      where it states them, the model where it does not) and fill them.
#                      Falls back to RAW_FIELDS rather than returning nothing.
#   RAW_FIELDS       - skip interpretation: one row per extracted element with its page.
#                      Nothing is decided, so nothing is decided wrongly.
app.no-template.mode=${NO_TEMPLATE_MODE:INFERRED_HEADERS}

# How records are placed into a template that may already hold the user's own data.
#   FILL_THEN_APPEND - fill the blank cells of existing rows, then append the rest below
#                      the last row holding data. A populated cell is never written over.
#   APPEND_ONLY      - append below existing data, leaving rows with gaps untouched.
#   OVERWRITE        - write from the first data row down, replacing what is there. The
#                      original behaviour; only safe on a genuinely empty template.
app.excel.write-mode=${EXCEL_WRITE_MODE:FILL_THEN_APPEND}
