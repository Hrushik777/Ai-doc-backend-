spring.datasource.url=jdbc:h2:mem:aidoc;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
nvidia.api.key=test-nvidia-api-key
nvidia.api.base-url=https://integrate.api.nvidia.com/v1/chat/completions
nvidia.api.connect-timeout=1s
nvidia.api.read-timeout=1s
nvidia.parse.model=nvidia/nemotron-parse
nvidia.mapping.model=nvidia/nemotron-3-super-120b-a12b
app.mapping.llm.confidence-threshold=0.80
